name: Hello Spring Boot App to Dockers

on: push

jobs:
  build-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: echo "Hello, Spring Boot!"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: "25"

      - name: Build and Test(Maven)
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        with:
           
            name: test-reports
           
            path: docker/app1-hello/springboot/hello-spring/target/surefire-reports

            

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-tests

    steps:
